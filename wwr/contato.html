<section class="contact-form">

    <h2>Envie sua Mensagem</h2>

    <form action="#" method="post">

        <label for="name">Nome</label>

        <input type="text" id="name" name="name" required>

        <label for="email">E-mail</label>

        <input type="email" id="email" name="email" required>

        <p>Finalidade da mensagem</p>

        <label>

            <input type="radio" name="purpose" value="consulta" required>

            Consulta Geral

        </label>

        <label>

            <input type="radio" name="purpose" value="reserva">

            Pergunta sobre Reserva

        </label>

        <label>

            <input type="radio" name="purpose" value="site">

            Sugestão de Site

        </label>

        <label for="message">Mensagem</label>

        <textarea id="message" name="message" rows="6" required></textarea>

        <label class="newsletter">

            <input type="checkbox" name="newsletter">

            Quero receber a newsletter mensal

        </label>

        <button type="submit">
            Enviar Mensagem
        </button>

    </form>

</section>
